<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Controle de Chaves</title>
    
    <link rel="manifest" href="./manifest.json">
    
    <link rel="icon" type="image/png" href="https://img.icons8.com/3d-fluency/512/key.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/3d-fluency/512/key.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            z-index: 999999;
        }
    </style>
</head>
<body>

    <iframe src="https://script.google.com/macros/s/AKfycbxdJ5o2MnT2BzdobiHwHGilEbcbCLzoEoE6If0g952uZV3f42i8ATHtc9bvA-p38oyx0Q/exec"></iframe>

    <script>
        // Registro do Service Worker obrigatório para o botão de instalação aparecer no Chrome
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado com sucesso!', reg))
                    .catch(err => console.error('Falha ao registrar o Service Worker:', err));
            });
        }
    </script>
</body>
</html>
