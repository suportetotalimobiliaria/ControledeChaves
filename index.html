<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <title>Controle de Chaves</title>
    
    <link rel="icon" type="image/png" href="https://img.icons8.com/3d-fluency/512/key.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/3d-fluency/512/key.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script>

<body style="background: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; font-family: system-ui, -apple-system, sans-serif;">

        <img src="https://img.icons8.com/3d-fluency/192/key.png" width="90" style="animation: pulse 1.5s infinite alternate;"><br><br>
        <div style="font-weight: bold; font-size: 1.1rem; letter-spacing: 0.5px;">Total Imobiliária</div>
        <p style="color: #a8aeb4; font-size: 0.9rem; margin-top: 5px;">Carregando chaves...</p>
    </div>
    <style>
        @keyframes pulse { from { transform: scale(0.95); opacity: 0.8; } to { transform: scale(1.05); opacity: 1; } }
    </style>
